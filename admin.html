<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101010;color:#eee;font-family:Arial,sans-serif}

button:disabled{opacity:.5}
.secondary{background:#292929;color:#eee}

.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.actions button{margin:0}

<input id="password" type="password" autocomplete="current-password" required>

<section id="adminPanel" class="hidden">

<div id="bookings"></div>
</section>

<p id="loginMessage" role="status"></p>
</main>

function errorText(error) {
  const code = error?.code || "unknown";
  const descriptions = {
    "auth/invalid-credential": "Nieprawidłowy e-mail lub hasło.",
    "auth/wrong-password": "Nieprawidłowe hasło.",
    "auth/user-not-found": "Nie znaleziono konta.",

    "permission-denied": "Firestore odrzucił dostęp. Sprawdź reguły administratora."
  };
  return (descriptions[code] || error?.message || "Nieznany błąd") +
         "\nKod błędu: " + code;
}

function showLoginError(error) {
  $("loginMessage").textContent = "Błąd logowania: " + errorText(error);
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  initialized = true;
} catch (error) {
  showLoginError(error);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginMessage").textContent = "";

  if (!initialized) {
    $("loginMessage").textContent =
      "Firebase nie został poprawnie uruchomiony. Odśwież stronę i sprawdź konfigurację.";
    return;
  }

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Logowanie…";

  try {
    const email = $("email").value.trim();
    const password = $("password").value;
    await signInWithEmailAndPassword(auth, email, password);
    $("loginMessage").textContent = "";
  } catch (error) {
    showLoginError(error);
  } finally {
    button.disabled = false;
    button.textContent = "Zaloguj się";
  }
});

$("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    $("message").textContent = errorText(error);
  }
});

  if (!user) {
    $("loginPanel").classList.remove("hidden");
    $("adminPanel").classList.add("hidden");
    $("bookings").replaceChildren();
    return;
  }

  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("accountInfo").textContent = "Konto: " + (user.email || "—");

  if (user.uid !== ADMIN_UID) {
    $("message").textContent =
      "To konto nie ma uprawnień administratora. UID: " + user.uid;
    $("bookings").replaceChildren();
    return;
  }

  await loadBookings();
});
