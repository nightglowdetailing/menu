
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NightGlow Detailing — Panel admina</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    h1 { color: #fff; }

    .panel, .booking {
      background: #1d1d1d;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 15px;
    }

    input {
      background: #111;
      color: white;
      border: 1px solid #555;
    }

    button {
      cursor: pointer;
      border: 0;
      font-weight: bold;
    }

    .confirm { background: #ddd; color: #111; }
    .reject { background: #8d2929; color: white; }
    .secondary { background: #444; color: white; }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .actions button { margin: 0; }

    .status { color: #ddd; font-weight: bold; }
    #message { overflow-wrap: anywhere; }
    .muted { color: #aaa; }
  </style>
</head>

<body>
<main>
  <h1>NightGlow Detailing</h1>
  <p class="muted">Panel administracyjny</p>

  <section id="loginPanel" class="panel">
    <h2>Logowanie</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="E-mail administratora"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Hasło"
        autocomplete="current-password" required>
      <button type="submit" class="confirm">Zaloguj się</button>
    </form>
  </section>

  <section id="adminPanel" hidden>
    <div class="panel">
      <button id="refresh" class="secondary">Odśwież rezerwacje</button>
      <button id="logout" class="secondary">Wyloguj</button>
      <p id="message" role="status">Oczekiwanie na logowanie…</p>
    </div>
    <div id="bookings"></div>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-GFFqYaJBIAJYRGCiG3RqsA0Qv7uqeHME",
  authDomain: "nightglow-detailing.firebaseapp.com",
  projectId: "nightglow-detailing",
  storageBucket: "nightglow-detailing.firebasestorage.app",
  messagingSenderId: "498718568327",
  appId: "1:498718568327:web:7407af75b4568883df2d22"
};

const ADMIN_UID = "G94trFFtkMXjH4g27uN0ceVmVcF2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function setMessage(text) {
  $("message").textContent = text;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  setMessage("Logowanie…");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  } catch (err) {
    setMessage("Błąd logowania: " + err.message);
  }
});

onAuthStateChanged(auth, async user => {
  if (user && user.uid === ADMIN_UID) {
    $("loginPanel").hidden = true;
    $("adminPanel").hidden = false;
    await loadBookings();
  } else {
    $("loginPanel").hidden = false;
    $("adminPanel").hidden = true;

    if (user) {
      setMessage("To konto nie ma uprawnień administratora.");
      await signOut(auth);
    }
  }
});

function openEmail(data, status) {
  if (!data.email || typeof data.email !== "string") {
    alert("Ta rezerwacja nie ma poprawnego adresu e-mail klienta.");
    return;
  }

  const confirmed = status === "confirmed";

  const subject = confirmed
    ? "Potwierdzenie rezerwacji — NightGlow Detailing"
    : "Informacja o rezerwacji — NightGlow Detailing";

  const body = confirmed
    ? `Cześć!

Potwierdzamy Twoją rezerwację w NightGlow Detailing.

Data: ${data.date || "do ustalenia"}
Samochód: ${data.car || "nie podano"}
Usługi: ${formatValue(data.services)}
Cena: ${data.price || "do ustalenia"}

Dziękujemy i do zobaczenia!

NightGlow Detailing`
    : `Cześć!

Niestety, nie możemy potwierdzić Twojej rezerwacji w podanym terminie.
Skontaktuj się z nami, aby ustalić inny termin.

Data: ${data.date || "nie podano"}

NightGlow Detailing`;

  const gmailUrl =
    "https://mail.google.com/mail/?view=cm&fs=1" +
    "&to=" + encodeURIComponent(data.email) +
    "&su=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);

  // Wywoływane bezpośrednio kliknięciem przycisku.
  window.open(gmailUrl, "_blank", "noopener,noreferrer");
}

function formatValue(value) {
  if (value == null || value === "") return "do ustalenia";
  return typeof value === "string" ? value : JSON.stringify(value);
}

async function changeStatus(id, data, status) {
  try {
    await updateDoc(doc(db, "bookings", id), { status });

    setMessage(
      status === "confirmed"
        ? "Rezerwacja potwierdzona. Teraz kliknij „Napisz e-mail”."
        : "Rezerwacja odrzucona. Teraz kliknij „Napisz e-mail”."
    );

    await loadBookings();
  } catch (err) {
    setMessage("Nie udało się zmienić statusu: " + err.message);
  }
}

async function loadBookings() {
  $("bookings").replaceChildren();
  setMessage("Pobieranie rezerwacji…");

  try {
    const snapshot = await getDocs(collection(db, "bookings"));

    if (snapshot.empty) {
      $("bookings").textContent = "Brak rezerwacji.";
      setMessage("Pobrano rezerwacje: 0");
      return;
    }

    snapshot.forEach(bookingDoc => {
      const data = bookingDoc.data();
      const card = document.createElement("div");
      card.className = "booking";

      const heading = document.createElement("h3");
      heading.textContent = "Rezerwacja: " + bookingDoc.id;
      card.appendChild(heading);

      for (const [key, value] of Object.entries(data)) {
        if (key === "status") continue;

        const line = document.createElement("p");
        line.textContent = key + ": " + formatValue(value);
        card.appendChild(line);
      }

      const status = data.status || "new";
      const statusLine = document.createElement("p");
      statusLine.className = "status";
      statusLine.textContent = "Status: " + status;
      card.appendChild(statusLine);

      const actions = document.createElement("div");
      actions.className = "actions";

      if (status !== "confirmed") {
        const confirm = document.createElement("button");
        confirm.className = "confirm";
        confirm.textContent = "Potwierdź";
        confirm.addEventListener("click", () =>
          changeStatus(bookingDoc.id, data, "confirmed")
        );
        actions.appendChild(confirm);
      }

      if (status !== "rejected") {
        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Odrzuć";
        reject.addEventListener("click", () =>
          changeStatus(bookingDoc.id, data, "rejected")
        );
        actions.appendChild(reject);
      }

      if (status === "confirmed" || status === "rejected") {
        const emailBtn = document.createElement("button");
        emailBtn.className = "secondary";
        emailBtn.textContent = "Napisz e-mail do klienta";
        emailBtn.addEventListener("click", () => openEmail(data, status));
        actions.appendChild(emailBtn);
      }

      card.appendChild(actions);
      $("bookings").appendChild(card);
    });

    setMessage("Pobrano rezerwacje: " + snapshot.size);
  } catch (err) {
    setMessage("Błąd Firestore: " + err.message);
  }
}

$("refresh").addEventListener("click", loadBookings);

$("logout").addEventListener("click", async () => {
  await signOut(auth);
});
</script>
</body>
</html>
