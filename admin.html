
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NightGlow Detailing — Admin</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    main { max-width: 900px; margin: auto; }

    .panel, .booking {
      background: #1d1d1d;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 15px;
    }

    input {
      background: #111;
      color: white;
      border: 1px solid #555;
    }

    button {
      cursor: pointer;
      border: 0;
      font-weight: bold;
    }

    button:disabled { opacity: .5; cursor: wait; }

    .confirm { background: #eee; color: #111; }
    .reject { background: #8d2929; color: white; }
    .secondary { background: #444; color: white; }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .actions button { margin: 0; }
    .status { font-weight: bold; }
    .message { overflow-wrap: anywhere; }
    .muted { color: #aaa; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
<main>
  <h1>NightGlow Detailing</h1>
  <p class="muted">Panel administracyjny</p>

  <section id="loginPanel" class="panel">
    <h2>Logowanie</h2>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="E-mail administratora" required>
      <input id="password" type="password"
        placeholder="Hasło" required>
      <button id="loginButton" type="submit" class="confirm">
        Zaloguj się
      </button>
    </form>

    <p id="loginMessage" class="message" role="status"></p>
  </section>

  <section id="adminPanel" hidden>
    <div class="panel">
      <button id="refresh" class="secondary">
        Odśwież rezerwacje
      </button>
      <button id="logout" class="secondary">Wyloguj</button>
      <p id="message" class="message" role="status"></p>
    </div>

    <div id="bookings"></div>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-GFFqYaJBIAJYRGCiG3RqsA0Qv7uqeHME",
  authDomain: "nightglow-detailing.firebaseapp.com",
  projectId: "nightglow-detailing",
  storageBucket: "nightglow-detailing.firebasestorage.app",
  messagingSenderId: "498718568327",
  appId: "1:498718568327:web:7407af75b4568883df2d22"
};

const ADMIN_UID = "G94trFFtkMXjH4g27uN0ceVmVcF2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

function setMessage(message) {
  $("message").textContent = message;
}

function setLoginMessage(message) {
  $("loginMessage").textContent = message;
}

function formatValue(value) {
  if (value == null || value === "") return "Nie podano";
  return typeof value === "string"
    ? value
    : JSON.stringify(value);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("loginButton");
  button.disabled = true;
  setLoginMessage("Logowanie…");

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
    setLoginMessage("");
  } catch (error) {
    setLoginMessage("Błąd logowania: " + error.message);
  } finally {
    button.disabled = false;
  }
});

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("loginPanel").hidden = false;
    $("adminPanel").hidden = true;
    return;
  }

  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    setLoginMessage("To konto nie ma uprawnień administratora.");
    return;
  }

  $("loginPanel").hidden = true;
  $("adminPanel").hidden = false;

  await loadBookings();
});

function openEmail(data, status) {
  if (
    typeof data.email !== "string" ||
    !data.email.trim() ||
    !data.email.includes("@")
  ) {
    alert("Ta rezerwacja nie zawiera poprawnego adresu e-mail.");
    return;
  }

  const confirmed = status === "confirmed";

  const subject = confirmed
    ? "Potwierdzenie rezerwacji — NightGlow Detailing"
    : "Informacja o rezerwacji — NightGlow Detailing";

  const services = formatValue(data.services);
  const date = data.date || "do ustalenia";
  const car = data.car || "nie podano";
  const price = data.price || "do ustalenia";

  const body = confirmed
    ? `Cześć!

Potwierdzamy Twoją rezerwację w NightGlow Detailing.

Data: ${date}
Samochód: ${car}
Usługi: ${services}
Cena: ${price}

Dziękujemy i do zobaczenia!

NightGlow Detailing`
    : `Cześć!

Niestety, nie możemy potwierdzić Twojej rezerwacji w podanym terminie.
Skontaktuj się z nami, aby ustalić inny termin.

Data: ${date}

NightGlow Detailing`;

  const url = "https://mail.google.com/mail/?view=cm&fs=1"
    + "&to=" + encodeURIComponent(data.email.trim())
    + "&su=" + encodeURIComponent(subject)
    + "&body=" + encodeURIComponent(body);

  // Otwiera gotową wiadomość. Nie wysyła jej automatycznie.
  window.open(url, "_blank");
}

async function changeStatus(id, status, button) {
  button.disabled = true;
  setMessage("Zapisywanie statusu…");

  try {
    await updateDoc(doc(db, "bookings", id), {
      status: status
    });

    await loadBookings();

    setMessage(
      status === "confirmed"
        ? "Rezerwacja potwierdzona. Kliknij „Napisz e-mail do klienta”."
        : "Rezerwacja odrzucona. Kliknij „Napisz e-mail do klienta”."
    );
  } catch (error) {
    setMessage("Nie udało się zmienić statusu: " + error.message);
    button.disabled = false;
  }
}

async function loadBookings() {
  $("bookings").replaceChildren();
  setMessage("Pobieranie rezerwacji…");

  try {
    const snapshot = await getDocs(collection(db, "bookings"));

    if (snapshot.empty) {
      $("bookings").textContent = "Brak rezerwacji.";
      setMessage("Pobrano rezerwacje: 0");
      return;
    }

    snapshot.forEach(bookingDoc => {
      const data = bookingDoc.data();
      const card = document.createElement("div");
      card.className = "booking";

      const heading = document.createElement("h3");
      heading.textContent = "Rezerwacja: " + bookingDoc.id;
      card.appendChild(heading);

      for (const [key, value] of Object.entries(data)) {
        if (key === "status") continue;

        const line = document.createElement("p");
        line.textContent = key + ": " + formatValue(value);
        card.appendChild(line);
      }

      const status = data.status || "new";
      const statusLine = document.createElement("p");
      statusLine.className = "status";
      statusLine.textContent = "Status: " + status;
      card.appendChild(statusLine);

      const actions = document.createElement("div");
      actions.className = "actions";

      if (status !== "confirmed") {
        const confirm = document.createElement("button");
        confirm.className = "confirm";
        confirm.textContent = "Potwierdź";

        confirm.addEventListener("click", () => {
          changeStatus(bookingDoc.id, "confirmed", confirm);
        });

        actions.appendChild(confirm);
      }

      if (status !== "rejected") {
        const reject = document.createElement("button");
        reject.className = "reject";
        reject.textContent = "Odrzuć";

        reject.addEventListener("click", () => {
          changeStatus(bookingDoc.id, "rejected", reject);
        });

        actions.appendChild(reject);
      }

      if (status === "confirmed" || status === "rejected") {
        const emailButton = document.createElement("button");
        emailButton.className = "secondary";
        emailButton.textContent = "Napisz e-mail do klienta";

        emailButton.addEventListener("click", () => {
          openEmail(data, status);
        });

        actions.appendChild(emailButton);
      }

      card.appendChild(actions);
      $("bookings").appendChild(card);
    });

    setMessage("Pobrano rezerwacje: " + snapshot.size);
  } catch (error) {
    setMessage("Błąd Firestore: " + error.message);
  }
}

$("refresh").addEventListener("click", loadBookings);

$("logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    setMessage("Błąd wylogowania: " + error.message);
  }
});
</script>
</body>
</html>
