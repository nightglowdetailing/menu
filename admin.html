
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightglow Detailing | Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101010;color:#eee;font-family:Arial,sans-serif}
main{max-width:900px;margin:auto}
.panel,.booking{background:#1b1b1b;border:1px solid #393939;border-radius:12px;padding:18px;margin:16px 0}
input,button{display:block;width:100%;padding:13px;margin:10px 0;border-radius:7px;border:1px solid #555;font-size:16px}
input{background:#111;color:white}
button{background:#eee;color:#111;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#292929;color:#eee}
.muted{color:#aaa}
#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#f0c98a}
.hidden{display:none!important}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.actions button{margin:0}
</style>
</head>
<body>
<main>
<h1>NIGHTGLOW DETAILING</h1>
<p class="muted">Panel administracyjny</p>

<section id="loginPanel" class="panel">
<h2>Logowanie</h2>
<form id="loginForm">
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Hasło</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">Zaloguj się</button>
</form>
</section>

<section id="adminPanel" class="hidden">
<div class="panel">
<h2>Rezerwacje</h2>
<p id="accountInfo" class="muted"></p>
<button id="refreshButton" type="button">Odśwież rezerwacje</button>
<button id="logoutButton" class="secondary" type="button">Wyloguj</button>
<p id="message" role="status"></p>
</div>
<div id="bookings"></div>
</section>

<p id="loginMessage" role="status"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-GFFqYaJBIAJYRGCiG3RqsA0Qv7uqeHME",
  authDomain: "nightglow-detailing.firebaseapp.com",
  projectId: "nightglow-detailing",
  storageBucket: "nightglow-detailing.firebasestorage.app",
  messagingSenderId: "498718568327",
  appId: "1:498718568327:web:7407af75b4568883df2d22"
};

const ADMIN_UID = "G94trFFtkMXjH4g27uN0ceVmVcF2";
const $ = id => document.getElementById(id);

let auth, db, initialized = false;

function errorText(error) {
  const code = error?.code || "unknown";
  const descriptions = {
    "auth/invalid-credential": "Nieprawidłowy e-mail lub hasło.",
    "auth/wrong-password": "Nieprawidłowe hasło.",
    "auth/user-not-found": "Nie znaleziono konta.",
    "auth/invalid-email": "Nieprawidłowy adres e-mail.",
    "auth/too-many-requests": "Za dużo prób. Spróbuj później.",
    "auth/unauthorized-domain": "Domena GitHub Pages nie jest dozwolona w Firebase Authentication.",
    "auth/api-key-not-valid": "Firebase odrzuca klucz API. Sprawdź konfigurację aplikacji Web.",
    "permission-denied": "Firestore odrzucił dostęp. Sprawdź reguły administratora."
  };
  return (descriptions[code] || error?.message || "Nieznany błąd") +
         "\nKod błędu: " + code;
}

function showLoginError(error) {
  $("loginMessage").textContent = "Błąd logowania: " + errorText(error);
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  initialized = true;
} catch (error) {
  showLoginError(error);
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginMessage").textContent = "";

  if (!initialized) {
    $("loginMessage").textContent =
      "Firebase nie został poprawnie uruchomiony. Odśwież stronę i sprawdź konfigurację.";
    return;
  }

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Logowanie…";

  try {
    const email = $("email").value.trim();
    const password = $("password").value;
    await signInWithEmailAndPassword(auth, email, password);
    $("loginMessage").textContent = "";
  } catch (error) {
    showLoginError(error);
  } finally {
    button.disabled = false;
    button.textContent = "Zaloguj się";
  }
});

$("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    $("message").textContent = errorText(error);
  }
});

$("refreshButton").addEventListener("click", loadBookings);

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("loginPanel").classList.remove("hidden");
    $("adminPanel").classList.add("hidden");
    $("bookings").replaceChildren();
    return;
  }

  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("accountInfo").textContent = "Konto: " + (user.email || "—");

  if (user.uid !== ADMIN_UID) {
    $("message").textContent =
      "To konto nie ma uprawnień administratora. UID: " + user.uid;
    $("bookings").replaceChildren();
    return;
  }

  await loadBookings();
});

function addField(card, label, value) {
  const p = document.createElement("p");
  const b = document.createElement("strong");
  b.textContent = label;
  p.append(b, document.createTextNode(
    value == null || value === "" ? "—" : String(value)
  ));
  card.appendChild(p);
}

async function loadBookings() {
  const user = auth.currentUser;
  if (!user || user.uid !== ADMIN_UID) return;

  $("message").textContent = "Pobieranie rezerwacji…";
  $("bookings").replaceChildren();

  try {
    const snapshot = await getDocs(collection(db, "bookings"));

    if (snapshot.empty) {
      $("message").textContent = "Nie ma jeszcze żadnych rezerwacji.";
      return;
    }

    const fragment = document.createDocumentFragment();

    snapshot.forEach(item => {
      const data = item.data();
      const card = document.createElement("article");
      card.className = "booking";

      const heading = document.createElement("h3");
      heading.textContent = data.name || data.clientName ||
        data.fullName || "Rezerwacja";
      card.appendChild(heading);

      addField(card, "E-mail: ", data.email || data.clientEmail);
      addField(card, "Telefon: ", data.phone || data.telephone);
      addField(card, "Usługa: ", data.service || data.services);
      addField(card, "Data: ",
        data.date || data.datetime || data.appointmentDate);
      addField(card, "Godzina: ",
        data.time || data.appointmentTime);
      addField(card, "Status: ", data.status || "nowa");

      const actions = document.createElement("div");
      actions.className = "actions";

      for (const [label, status] of [
        ["Potwierdź", "confirmed"],
        ["Odrzuć", "rejected"],
        ["Oczekuje", "pending"]
      ]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = label;
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await updateDoc(doc(db, "bookings", item.id), { status });
            await loadBookings();
          } catch (error) {
            $("message").textContent =
              "Nie udało się zmienić statusu: " + errorText(error);
            btn.disabled = false;
          }
        });
        actions.appendChild(btn);
      }

      const email = data.email || data.clientEmail;
      if (email) {
        const mail = document.createElement("button");
        mail.type = "button";
        mail.className = "secondary";
        mail.textContent = "Otwórz Gmail";
        mail.addEventListener("click", () => {
          const status = data.status || "nowa";
          const subject = status === "confirmed"
            ? "Potwierdzenie rezerwacji — Nightglow Detailing"
            : status === "rejected"
            ? "Informacja o rezerwacji — Nightglow Detailing"
            : "Rezerwacja — Nightglow Detailing";

          const body = status === "confirmed"
            ? "Dzień dobry,\n\nPotwierdzamy rezerwację.\n\nNightglow Detailing"
            : status === "rejected"
            ? "Dzień dobry,\n\nNiestety nie możemy potwierdzić rezerwacji. Prosimy o kontakt w sprawie innego terminu.\n\nNightglow Detailing"
            : "Dzień dobry,\n\nKontaktujemy się w sprawie rezerwacji.\n\nNightglow Detailing";

          const url = "https://mail.google.com/mail/?view=cm&fs=1" +
            "&to=" + encodeURIComponent(email) +
            "&su=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);
          window.open(url, "_blank", "noopener,noreferrer");
        });
        actions.appendChild(mail);
      }

      card.appendChild(actions);
      fragment.appendChild(card);
    });

    $("bookings").appendChild(fragment);
    $("message").textContent = "Wczytano rezerwacje: " + snapshot.size;
  } catch (error) {
    $("message").textContent =
      "Błąd pobierania rezerwacji: " + errorText(error);
  }
}
</script>
</body>
</html>
